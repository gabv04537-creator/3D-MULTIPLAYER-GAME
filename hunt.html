<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Hunt | EXIT 8 PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0a0a0a; 
            font-family: 'IBM Plex Mono', monospace; /* Switched to a cleaner mono font for Exit 8 */
        }

        #ui-layer {
            position: fixed; 
            top: 20px; 
            right: 20px; /* Moved objectives to the right to avoid overlapping the Protocol UI */
            color: white;
            pointer-events: none; 
            z-index: 10;
        }

        .item-list {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px; 
            border: 2px solid #00ffcc;
            min-width: 200px;
        }

        .found { 
            text-decoration: line-through; 
            color: #00ffcc; 
            opacity: 0.5;
        }

        #crosshair {
            position: fixed; 
            top: 50%; 
            left: 50%;
            width: 10px; 
            height: 10px;
            border: 1px solid #fff; 
            border-radius: 50%;
            transform: translate(-50%, -50%); 
            pointer-events: none;
            mix-blend-mode: difference;
        }

        #instructions {
            position: fixed; 
            bottom: 240px; /* Moved up to clear the chat box */
            left: 50%;
            transform: translateX(-50%); 
            color: #00ffcc;
            text-align: center; 
            background: rgba(0,0,0,0.8); 
            padding: 8px 20px;
            font-size: 12px;
            border: 1px solid #00ffcc;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions">FIND ANOMALIES. IF FOUND, TURN BACK. IF NOT, GO FORWARD.</div>

    <script src="/socket.io/socket.io.js"></script>
    
    <script type="module" src="hunt.js"></script>
</body>
</html>
