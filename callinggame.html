<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Calling Room | Breach Protocol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; background: #020205; touch-action: none; }
        
        #ui-layer {
            position: absolute; top: 15px; width: 100%;
            text-align: center; color: #00f2ff; pointer-events: none; z-index: 10;
        }
        #game-status {
            background: rgba(10, 10, 20, 0.8); padding: 8px 15px;
            border: 1px solid #ff0055; display: inline-block; font-size: 14px;
            letter-spacing: 2px; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        #leaderboard {
            position: absolute; left: 10px; top: 70px; width: 150px;
            background: rgba(0, 0, 0, 0.8); border: 1px solid #00f2ff;
            color: #fff; padding: 10px; font-size: 11px; z-index: 5;
            border-left: 4px solid #00f2ff;
        }

        #chat-container {
            position: absolute; left: 50%; bottom: 180px; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 150px;
            background: rgba(5, 5, 10, 0.85); border: 1px solid #fbff00;
            display: flex; flex-direction: column; z-index: 20;
            box-shadow: 0 0 20px rgba(251, 255, 0, 0.1);
        }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 8px; color: #fff; font-size: 12px; line-height: 1.4; }
        #chat-input {
            width: 100%; background: #000; border: none; border-top: 1px solid #fbff00;
            color: #fbff00; padding: 12px; outline: none; box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        #controls {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; z-index: 100;
            padding: 0 10px; box-sizing: border-box;
            pointer-events: none; /* Let clicks pass through empty space */
        }
        button {
            padding: 12px 18px; background: #0a0a0a; color: #00f2ff;
            border: 1px solid #00f2ff; cursor: pointer; font-size: 11px;
            font-weight: bold; text-transform: uppercase; transition: 0.2s;
            font-family: 'Courier New', monospace;
            pointer-events: auto; /* Re-enable clicks for the actual buttons */
        }
        button:hover { background: #00f2ff; color: #000; box-shadow: 0 0 15px #00f2ff; }
        
        #vote-btn { border-color: #fbff00; color: #fbff00; display: block; }
        
        /* Fixed: Re-enabled standard display for initial state to ensure JS finds it */
        #contact-btn { 
            background: #fbff00; 
            color: #000; 
            border: none; 
            display: none; 
            font-size: 14px; 
            padding: 12px 24px; 
            box-shadow: 0 0 15px rgba(251, 255, 0, 0.4);
        }
        
        #final-breach-btn { background: #ff0055; color: #fff; border: none; display: none; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(255, 0, 85, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
        }

        .msg-system { color: #fbff00; font-style: italic; }
        .msg-useless { color: #ff0055; text-decoration: line-through; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="game-status">ESTABLISHING CONNECTION...</div>
    </div>

    <div id="leaderboard">
        <div style="color:#00f2ff; margin-bottom:8px; border-bottom: 1px solid #00f2ff; padding-bottom: 4px;">TERMINAL_USERS</div>
        <ul id="player-list" style="list-style:none; padding:0; margin:0;"></ul>
    </div>

    <div id="chat-container">
        <div id="chat-messages">
            <div class="msg-system">CORE_LOADED: Awaiting lock signal...</div>
        </div>
        <input type="text" id="chat-input" placeholder="Communicate..." autocomplete="off">
    </div>

    <div id="controls">
        <button id="vote-btn">LOCK SIGNAL</button>
        <button id="contact-btn">CONTACT!</button>
        <button id="final-breach-btn">FINAL BREACH</button>
        <button onclick="location.href='index.html'" style="border-color: #666; color: #666;">ABORT</button>
    </div>

    <script src="callinggame.js"></script>

</body>
</html>
